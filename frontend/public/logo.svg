<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="gG" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gY" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo escuro -->
  <rect width="120" height="120" fill="#07101d" rx="18"/>

  <!-- ══ GARRAFA (neon verde) ══ -->
  <!-- Tampa -->
  <rect x="43" y="10" width="10" height="6" rx="2" fill="none" stroke="#39ff14" stroke-width="2.5" filter="url(#gG)"/>
  <!-- Gargalo -->
  <line x1="48" y1="16" x2="48" y2="30" stroke="#39ff14" stroke-width="2.5" filter="url(#gG)" stroke-linecap="round"/>
  <!-- Ombro esquerdo -->
  <path d="M48 30 Q36 38 33 54" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round" filter="url(#gG)"/>
  <!-- Ombro direito -->
  <path d="M48 30 Q60 38 63 54" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round" filter="url(#gG)"/>
  <!-- Corpo esquerdo -->
  <line x1="33" y1="54" x2="33" y2="94" stroke="#39ff14" stroke-width="2.5" filter="url(#gG)" stroke-linecap="round"/>
  <!-- Corpo direito -->
  <line x1="63" y1="54" x2="63" y2="94" stroke="#39ff14" stroke-width="2.5" filter="url(#gG)" stroke-linecap="round"/>
  <!-- Fundo garrafa -->
  <line x1="33" y1="94" x2="63" y2="94" stroke="#39ff14" stroke-width="2.5" filter="url(#gG)" stroke-linecap="round"/>
  <!-- Rótulo -->
  <rect x="38" y="64" width="20" height="14" rx="2" fill="none" stroke="#39ff14" stroke-width="1.8" filter="url(#gG)"/>

  <!-- ══ CANECA DE CERVEJA (neon azul) ══ -->
  <!-- Corpo -->
  <path d="M72 36 L72 96 L98 96 L98 36 Z" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linejoin="round" filter="url(#gB)"/>
  <!-- Alça -->
  <path d="M98 50 C112 50 112 82 98 82" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#gB)"/>
  <!-- Espuma -->
  <path d="M70 36 Q77 24 85 34 Q92 22 100 36" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" filter="url(#gB)"/>

  <!-- ══ BRILHOS (neon amarelo) ══ -->
  <line x1="10" y1="22" x2="16" y2="14" stroke="#ffe44d" stroke-width="2" stroke-linecap="round" filter="url(#gY)"/>
  <line x1="14" y1="30" x2="22" y2="28" stroke="#ffe44d" stroke-width="2" stroke-linecap="round" filter="url(#gY)"/>
  <line x1="10" y1="38" x2="18" y2="40" stroke="#ffe44d" stroke-width="1.5" stroke-linecap="round" filter="url(#gY)"/>
</svg>
